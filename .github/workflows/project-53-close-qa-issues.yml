# Polls identifinet Project v2 #53 every 10 minutes and on manual dispatch.
#
# Required secret:
# - PROJECT_AUTOMATION_TOKEN
#   The default GITHUB_TOKEN cannot reliably read/write an organization Project v2
#   or administer issues across every repository in the org. Configure this secret
#   with project access plus permission to edit issues in all target repositories.
#   For a classic PAT, `project` and `repo` are typically required. For a
#   fine-grained token, grant organization Projects read/write and repository
#   Issues read/write across the applicable identifinet repositories.
#
# Behavior:
# - Resolves the Project v2 single-select field named "Delivery Status" once via
#   GraphQL and matches item field values by field ID.
# - Paginates all project items.
# - When a project item is an issue whose Delivery Status value is exactly "QA",
#   closes the issue and removes all assignees.
name: Close Project 53 QA Issues

on:
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'

concurrency:
  group: project-53-close-qa-issues
  cancel-in-progress: false

permissions: {}

env:
  ORGANIZATION_LOGIN: identifinet
  PROJECT_NUMBER: '53'
  DELIVERY_STATUS_FIELD_NAME: Delivery Status
  QA_OPTION_NAME: QA
  # Set to 'false' once the field/value wiring is confirmed to silence per-item logs.
  DIAGNOSTICS: 'true'

jobs:
  close-qa-issues:
    runs-on: ubuntu-latest

    steps:
      - name: Validate required secret
        env:
          PROJECT_AUTOMATION_TOKEN: ${{ secrets.PROJECT_AUTOMATION_TOKEN }}
        run: |
          if [ -z "$PROJECT_AUTOMATION_TOKEN" ]; then
            echo '::error::Missing PROJECT_AUTOMATION_TOKEN secret. Configure a token with organization Project access and permission to edit issues across target repositories.'
            exit 1
          fi

      - name: Close matching issues and clear assignees
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PROJECT_AUTOMATION_TOKEN }}
          script: |
            const organizationLogin = process.env.ORGANIZATION_LOGIN;
            const projectNumber = Number(process.env.PROJECT_NUMBER);
            const fieldName = process.env.DELIVERY_STATUS_FIELD_NAME;
            const targetOptionName = process.env.QA_OPTION_NAME;
            const diagnostics = process.env.DIAGNOSTICS === 'true';

            const getErrorMessage = (error) => error instanceof Error ? error.message : String(error);

            const projectFieldsQuery = `
              query ProjectFields($organizationLogin: String!, $projectNumber: Int!, $after: String) {
                organization(login: $organizationLogin) {
                  projectV2(number: $projectNumber) {
                    id
                    title
                    fields(first: 100, after: $after) {
                      nodes {
                        __typename
                        ... on ProjectV2Field {
                          id
                          name
                          dataType
                        }
                        ... on ProjectV2IterationField {
                          id
                          name
                          dataType
                        }
                        ... on ProjectV2SingleSelectField {
                          id
                          name
                          dataType
                          options {
                            id
                            name
                          }
                        }
                      }
                      pageInfo {
                        hasNextPage
                        endCursor
                      }
                    }
                  }
                }
              }
            `;

            const projectItemsQuery = `
              query ProjectItems($organizationLogin: String!, $projectNumber: Int!, $after: String) {
                organization(login: $organizationLogin) {
                  projectV2(number: $projectNumber) {
                    id
                    title
                    items(first: 100, after: $after) {
                      nodes {
                        id
                        fieldValues(first: 100) {
                          nodes {
                            __typename
                            ... on ProjectV2ItemFieldSingleSelectValue {
                              name
                              optionId
                              field {
                                __typename
                                ... on ProjectV2FieldCommon {
                                  id
                                  name
                                }
                              }
                            }
                          }
                          pageInfo {
                            hasNextPage
                            endCursor
                          }
                        }
                        content {
                          __typename
                          ... on Issue {
                            id
                            number
                            title
                            state
                            assignees(first: 0) {
                              totalCount
                            }
                            repository {
                              nameWithOwner
                            }
                          }
                          ... on PullRequest {
                            id
                            number
                            repository {
                              nameWithOwner
                            }
                          }
                          ... on DraftIssue {
                            id
                            title
                          }
                        }
                      }
                      pageInfo {
                        hasNextPage
                        endCursor
                      }
                    }
                  }
                }
              }
            `;

            const itemFieldValuesQuery = `
              query ItemFieldValues($itemId: ID!, $after: String) {
                node(id: $itemId) {
                  ... on ProjectV2Item {
                    fieldValues(first: 100, after: $after) {
                      nodes {
                        __typename
                        ... on ProjectV2ItemFieldSingleSelectValue {
                          name
                          optionId
                          field {
                            __typename
                            ... on ProjectV2FieldCommon {
                              id
                              name
                            }
                          }
                        }
                      }
                      pageInfo {
                        hasNextPage
                        endCursor
                      }
                    }
                  }
                }
              }
            `;

            const updateIssueMutation = `
              mutation UpdateIssue($issueId: ID!) {
                updateIssue(input: { id: $issueId, state: CLOSED, assigneeIds: [] }) {
                  issue {
                    id
                    number
                    state
                    repository {
                      nameWithOwner
                    }
                  }
                }
              }
            `;

            const isQaDeliveryStatus = (fieldValue) => (
              fieldValue?.__typename === 'ProjectV2ItemFieldSingleSelectValue' &&
              (fieldValue.field?.id === deliveryStatusFieldId || fieldValue.field?.name === fieldName) &&
              (
                (qaOptionId != null && fieldValue.optionId === qaOptionId) ||
                fieldValue.name === targetOptionName
              )
            );

            let projectId = null;
            let projectTitle = null;
            let fieldsCursor = null;
            const availableFieldNames = [];
            const matchingFields = [];

            do {
              const projectFieldsResponse = await github.graphql(projectFieldsQuery, {
                organizationLogin,
                projectNumber,
                after: fieldsCursor
              });

              const project = projectFieldsResponse.organization?.projectV2;
              if (!project) {
                throw new Error(
                  fieldsCursor
                    ? `Organization project ${organizationLogin}#${projectNumber} became unavailable during field lookup.`
                    : `Organization project ${organizationLogin}#${projectNumber} was not found.`
                );
              }

              projectId ??= project.id;
              projectTitle ??= project.title;

              for (const field of project.fields.nodes) {
                if (field?.name) {
                  availableFieldNames.push(field.name);
                }

                if (field?.name === fieldName) {
                  matchingFields.push(field);
                }
              }

              fieldsCursor = project.fields.pageInfo.hasNextPage ? project.fields.pageInfo.endCursor : null;
            } while (fieldsCursor);

            if (matchingFields.length === 0) {
              const sortedFieldNames = [...new Set(availableFieldNames)]
                .sort((left, right) => left.localeCompare(right));

              throw new Error(
                `Project ${organizationLogin}#${projectNumber} does not contain a field named "${fieldName}". ` +
                `Available fields: ${sortedFieldNames.join(', ') || '(none)'}.`
              );
            }

            const deliveryStatusField = matchingFields.find(
              (field) => field.__typename === 'ProjectV2SingleSelectField'
            );

            if (!deliveryStatusField) {
              const actualFieldTypes = matchingFields
                .map((field) => `${field.__typename}${field.dataType ? ` (${field.dataType})` : ''}`)
                .join(', ');

              throw new Error(
                `Project ${organizationLogin}#${projectNumber} field "${fieldName}" is not a ` +
                `ProjectV2SingleSelectField. Actual field type(s): ${actualFieldTypes}.`
              );
            }

            const qaOption = deliveryStatusField.options.find((option) => option.name === targetOptionName);
            if (!qaOption) {
              const availableOptionNames = deliveryStatusField.options
                .map((option) => option.name)
                .sort((left, right) => left.localeCompare(right));

              // Organization-level fields do not expose their options through the project
              // field connection, so fall back to matching item values by option name.
              core.warning(
                `Project ${organizationLogin}#${projectNumber} field "${fieldName}" did not expose ` +
                `option "${targetOptionName}" (available options: ${availableOptionNames.join(', ') || '(none)'}). ` +
                `Matching items by value name "${targetOptionName}" instead.`
              );
            }

            const deliveryStatusFieldId = deliveryStatusField.id;
            const qaOptionId = qaOption ? qaOption.id : null;
            if (diagnostics) {
              core.info(
                `Diagnostics: resolved field definition ` +
                JSON.stringify({
                  id: deliveryStatusField.id,
                  dataType: deliveryStatusField.dataType,
                  options: deliveryStatusField.options
                })
              );
            }
            core.info(
              `Scanning project ${organizationLogin}#${projectNumber} for item field ` +
              `"${fieldName}" with target value "${targetOptionName}".`
            );
            core.info(`Loaded project ${projectTitle} (${projectId}).`);
            core.info(
              `Resolved "${fieldName}" to single-select field ${deliveryStatusFieldId} ` +
              `and "${targetOptionName}" to option ${qaOptionId ?? '(matched by name)'}.`
            );

            let itemsCursor = null;
            let inspectedItemCount = 0;
            let eligibleIssueCount = 0;
            let updatedIssueCount = 0;
            let skippedNonIssueCount = 0;
            let skippedNonQaCount = 0;
            let failedIssueCount = 0;
            let skippedClosedUnassignedCount = 0;
            let skippedDuplicateQaIssueCount = 0;
            const processedIssueIds = new Set();

            do {
              const response = await github.graphql(projectItemsQuery, {
                organizationLogin,
                projectNumber,
                after: itemsCursor
              });

              const project = response.organization?.projectV2;
              if (!project) {
                throw new Error(
                  itemsCursor
                    ? `Organization project ${organizationLogin}#${projectNumber} became unavailable during processing.`
                    : `Organization project ${organizationLogin}#${projectNumber} was not found.`
                );
              }

              projectId ??= project.id;
              projectTitle ??= project.title;

              for (const item of project.items.nodes) {
                inspectedItemCount += 1;

                const contentType = item.content?.__typename;
                if (contentType !== 'Issue') {
                  skippedNonIssueCount += 1;
                  continue;
                }

                if (diagnostics) {
                  const singleSelectValues = item.fieldValues.nodes
                    .filter((value) => value?.__typename === 'ProjectV2ItemFieldSingleSelectValue')
                    .map((value) => `${value.field?.name ?? '(unknown field)'}=${value.name ?? '(empty)'}`);
                  core.info(
                    `Diagnostics: ${item.content.repository?.nameWithOwner ?? '(no repo)'}#${item.content.number} ` +
                    `single-select values: ${singleSelectValues.join('; ') || '(none)'}.`
                  );
                }

                let hasQaDeliveryStatus = item.fieldValues.nodes.some(isQaDeliveryStatus);

                let fieldValuesCursor = item.fieldValues.pageInfo.hasNextPage
                  ? item.fieldValues.pageInfo.endCursor
                  : null;

                while (!hasQaDeliveryStatus && fieldValuesCursor) {
                  const fieldValuesResponse = await github.graphql(itemFieldValuesQuery, {
                    itemId: item.id,
                    after: fieldValuesCursor
                  });

                  const fieldValuesConnection = fieldValuesResponse.node?.fieldValues;
                  if (!fieldValuesConnection) {
                    throw new Error(`Project item ${item.id} became unavailable during field value lookup.`);
                  }

                  hasQaDeliveryStatus = fieldValuesConnection.nodes.some(isQaDeliveryStatus);
                  fieldValuesCursor = fieldValuesConnection.pageInfo.hasNextPage
                    ? fieldValuesConnection.pageInfo.endCursor
                    : null;
                }

                if (!hasQaDeliveryStatus) {
                  skippedNonQaCount += 1;
                  continue;
                }

                const issue = item.content;
                if (processedIssueIds.has(issue.id)) {
                  skippedDuplicateQaIssueCount += 1;
                  core.info(`Skipping duplicate project item for ${issue.repository.nameWithOwner}#${issue.number}.`);
                  continue;
                }

                processedIssueIds.add(issue.id);
                eligibleIssueCount += 1;

                const needsUpdate = issue.state !== 'CLOSED' || issue.assignees.totalCount > 0;

                if (!needsUpdate) {
                  skippedClosedUnassignedCount += 1;
                  core.info(
                    `Skipping ${issue.repository.nameWithOwner}#${issue.number} because it is already closed and unassigned.`
                  );
                  continue;
                }

                core.info(
                  `Processing ${issue.repository.nameWithOwner}#${issue.number} ` +
                  `(state=${issue.state}).`
                );

                try {
                  const mutationResult = await github.graphql(updateIssueMutation, {
                    issueId: issue.id
                  });

                  const updatedIssue = mutationResult.updateIssue.issue;
                  updatedIssueCount += 1;
                  core.info(
                    `Updated ${updatedIssue.repository.nameWithOwner}#${updatedIssue.number}: ` +
                    `state=${updatedIssue.state}.`
                  );
                } catch (error) {
                  failedIssueCount += 1;
                  core.warning(
                    `Failed to update ${issue.repository.nameWithOwner}#${issue.number}: ${getErrorMessage(error)}`
                  );
                }
              }

              itemsCursor = project.items.pageInfo.hasNextPage ? project.items.pageInfo.endCursor : null;
            } while (itemsCursor);

            core.summary
              .addHeading('Project 53 QA automation')
              .addRaw(`Inspected items: ${inspectedItemCount}`, true)
              .addRaw(`Matching issues: ${eligibleIssueCount}`, true)
              .addRaw(`Updated issues: ${updatedIssueCount}`, true)
              .addRaw(`Skipped non-issues: ${skippedNonIssueCount}`, true)
              .addRaw(`Skipped non-QA issues: ${skippedNonQaCount}`, true)
              .addRaw(`Skipped duplicate QA issues: ${skippedDuplicateQaIssueCount}`, true)
              .addRaw(`Skipped closed and unassigned issues: ${skippedClosedUnassignedCount}`, true)
              .addRaw(`Failed updates: ${failedIssueCount}`, true);

            await core.summary.write();

            core.info(
              `Completed Project ${projectNumber} QA scan: ` +
              `${updatedIssueCount}/${eligibleIssueCount} matching issues updated, ` +
              `${failedIssueCount} update failures.`
            );
